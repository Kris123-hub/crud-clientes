services:
  db:
    image: mysql:8.0
    container_name: crud_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crud_clientes
      MYSQL_USER: crud_user
      MYSQL_PASSWORD: crud_pass
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./api/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - crud_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crud_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: crud_clientes
      DB_USER: crud_user
      DB_PASSWORD: crud_pass
    networks:
      - crud_net

volumes:
  db_data:

networks:
  crud_net:
    driver: bridge
